name: Main

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  # The matrix follows Go's release aliases, so a Go release can break this
  # without a commit here. A weekly run reports that when it happens, not at
  # the next push, which can be months later. GitHub disables the schedule on a
  # public repository after 60 days without activity; `gh workflow enable
  # main.yml` restores it, and workflow_dispatch runs it on demand.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  main:
    name: Lint and test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report both versions rather than cancelling the pair on the first
      # failure: which of the two broke is the whole point of testing both.
      fail-fast: false
      matrix:
        # The Go releases that are actually supported, whichever those are:
        # upstream Go maintains the current release and the one before it. These
        # aliases move on their own, so a new Go release can turn this red
        # without a commit here -- which is the point, since operators upgrade
        # Traefik whether or not we are ready. go.mod declares the minimum, and
        # has to stay at or below oldstable.
        go-version: ['oldstable', 'stable']
    env:
      # Each tool is a release tarball checked against the SHA-256 pinned beside
      # it, so changing a version means changing its hash in the same edit. The
      # hash is of the linux-amd64 tarball. Take it from the release's checksums
      # file and confirm it by hashing the download.
      GOLANGCI_LINT_VERSION: v2.15.0
      GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
      YAEGI_VERSION: v0.16.1
      YAEGI_SHA256: 396e30227c21172324147a3c603a044a0cc0ed8bbda490fd34831905ff977f96
      CGO_ENABLED: 0
    defaults:
      run:
        # `yaegi test` resolves imports through GOPATH rather than the module
        # cache, so the checkout has to live at its own module path for the
        # Yaegi step to find the plugin's own packages.
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

    steps:

      # https://github.com/marketplace/actions/checkout
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: go/src/github.com/${{ github.repository }}
          # Nothing after the checkout talks to GitHub as this repository, so
          # leave no token in .git/config for a later step to read.
          persist-credentials: false

      # https://github.com/marketplace/actions/setup-go-environment
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          # The plugin has no dependencies, so there is no go.sum to key a cache on.
          cache: false

      # Not the projects' install.sh scripts: those are fetched from a branch, so
      # the code that runs here would be whatever the branch holds that day, and
      # they verify the download against a checksum fetched from the same
      # release, which proves nothing if the release is what changed.
      #
      # golangci-lint publishes build attestations for its releases, which
      # `gh attestation verify` can check. The hash here was checked that way.
      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: |
          name="golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64"
          curl -sSfL -o "${RUNNER_TEMP}/${name}.tar.gz" "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/${name}.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum --check --strict -
          mkdir -p "${HOME}/go/bin"
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${HOME}/go/bin" --strip-components=1 "${name}/golangci-lint"

      # Yaegi publishes no attestation or signature, so this hash is trust on
      # first use: it pins the tarball that was current when it was recorded.
      - name: Install Yaegi ${{ env.YAEGI_VERSION }}
        run: |
          name="yaegi_${YAEGI_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${name}" "https://github.com/traefik/yaegi/releases/download/${YAEGI_VERSION}/${name}"
          echo "${YAEGI_SHA256}  ${RUNNER_TEMP}/${name}" | sha256sum --check --strict -
          mkdir -p "${HOME}/go/bin"
          tar -xzf "${RUNNER_TEMP}/${name}" -C "${HOME}/go/bin" yaegi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod

      - name: Lint and test
        run: make

      # Traefik runs this plugin through Yaegi rather than compiling it, so the
      # interpreter has to agree with the compiler about what the code does.
      - name: Test under Yaegi
        run: make yaegi_test
        env:
          GOPATH: ${{ github.workspace }}/go
