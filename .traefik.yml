displayName: Rewrite Body (with compression support)

summary: Rewrite HTTP response bodies by regex, including gzip and deflate encoded responses. Maintained fork of packruler/rewrite-body.

type: middleware

import: github.com/kelnei/rewrite-body

# Traefik instantiates the plugin with this configuration to validate it, and
# the catalog shows it as the worked example, so the keys have to match Config
# exactly -- an unknown one is dropped in silence. `types` names two entries
# rather than the single default for that reason: if this block ever stops
# binding, what the plugin reports no longer matches what is written here.
testData:
  lastModified: true
  rewrites:
    - regex: "bar"
      replacement: "foo"
  monitoring:
    types:
      - text/html
      - application/json
    methods:
      - GET
