run:
  timeout: 3m

linters-settings:
  govet:
    enable:
      - shadow
  gocyclo:
    min-complexity: 12
  goconst:
    min-len: 3
    min-occurrences: 4
  misspell:
    locale: US
  funlen:
    lines: 60
    statements: 40
  ireturn:
    # ireturn allows using `allow` and `reject` settings at the same time.
    # Both settings are lists of the keywords and regular expressions matched to interface or package names.
    # keywords:
    # - `empty` for `interface{}`
    # - `error` for errors
    # - `stdlib` for standard library
    # - `anon` for anonymous interfaces

    # By default, it allows using errors, empty interfaces, anonymous interfaces,
    # and interfaces provided by the standard library.
    allow:
      - anon
      - error
      - empty
      - stdlib
      # You can specify idiomatic endings for interface
      - (or|er)$
      - github.com/kelnei/rewrite-body/logger.LogWriter

# Upstream used `enable-all: true`, which silently takes on every linter each
# new golangci-lint release adds. By 2026 that meant ~54 findings, nearly all
# from linters that did not exist when this code was written, and CI that could
# never go green. The set below is explicit so a golangci-lint upgrade changes
# the version, not the rules.
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - dogsled
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - importas
    - ireturn
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - wsl

issues:
  exclude-use-default: false
  max-per-linter: 0
  max-same-issues: 0
  exclude:
    - don't use an underscore in package name
    - "ST1003: should not use underscores in package names"
    # CloseNotify is a deprecated interface kept deliberately, for callers that
    # still type-assert for it. See httputil/response_writer.go.
    - "SA1019: http.CloseNotifier has been deprecated"
  exclude-rules:
    - path: (.+)_test.go
      linters:
        - dupl
        - goconst
        - funlen
        - godot
        - lll
    - path: config.go
      linters:
        - lll
